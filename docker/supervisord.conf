[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/data/run/supervisord.pid
childlogdir=/data/logs

[unix_http_server]
file=/data/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///data/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
priority=10
command=/usr/local/bin/run-postgres
directory=/home/user/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/data/logs/postgres.log
stderr_logfile=/data/logs/postgres.err

[program:redis]
priority=20
command=/usr/bin/redis-server /data/run/redis.conf
directory=/home/user/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/data/logs/redis.log
stderr_logfile=/data/logs/redis.err

[program:postgres-backup]
priority=25
command=/usr/local/bin/postgres-backup-loop
directory=/home/user/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=120
stdout_logfile=/data/logs/postgres-backup.log
stderr_logfile=/data/logs/postgres-backup.err

[program:plugin-daemon]
priority=30
command=/usr/local/bin/wait-for-core postgres redis -- /usr/local/bin/with-plugin-env bash -c '/opt/dify/plugin-daemon/commandline migrate && exec /opt/dify/plugin-daemon/main'
directory=/opt/dify/plugin-daemon
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/data/logs/plugin-daemon.log
stderr_logfile=/data/logs/plugin-daemon.err

[program:sandbox]
priority=35
command=/usr/local/bin/with-sandbox-env /opt/dify/sandbox/main
directory=/
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sandbox-selfcheck]
priority=36
command=/usr/local/bin/with-dify-env /usr/local/bin/python3 /usr/local/bin/dify-sandbox-selfcheck
directory=/home/user/app
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/data/logs/sandbox-selfcheck.log
stderr_logfile=/data/logs/sandbox-selfcheck.err

[program:dify-api]
priority=40
command=/usr/local/bin/wait-for-core postgres redis -- /usr/local/bin/with-dify-env bash -c 'cd /app/api && MODE=api MIGRATION_ENABLED=false ./docker/entrypoint.sh'
directory=/app/api
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/data/logs/dify-api.log
stderr_logfile=/data/logs/dify-api.err

[program:dify-agent]
priority=90
command=/usr/local/bin/with-dify-env /usr/local/bin/run-dify-agent
directory=/app/api
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/data/logs/dify-agent.log
stderr_logfile=/data/logs/dify-agent.err

[program:shellctl]
priority=85
command=/usr/local/bin/with-dify-env /usr/local/bin/run-shellctl
directory=/home/user
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/data/logs/shellctl.log
stderr_logfile=/data/logs/shellctl.err

[program:dify-worker]
priority=50
command=/usr/local/bin/wait-for-core postgres redis -- /usr/local/bin/with-dify-env bash -c 'cd /app/api && MODE=worker MIGRATION_ENABLED=false ./docker/entrypoint.sh'
directory=/app/api
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/data/logs/dify-worker.log
stderr_logfile=/data/logs/dify-worker.err

[program:dify-beat]
priority=60
command=/usr/local/bin/wait-for-core postgres redis -- /usr/local/bin/with-dify-env bash -c 'cd /app/api && MODE=beat MIGRATION_ENABLED=false ./docker/entrypoint.sh'
directory=/app/api
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/data/logs/dify-beat.log
stderr_logfile=/data/logs/dify-beat.err

[program:dify-web]
priority=70
command=/usr/local/bin/wait-for-core api -- /usr/local/bin/with-dify-env bash -c 'cd /app && env HOSTNAME=0.0.0.0 npm_config_host=0.0.0.0 ./entrypoint.sh'
directory=/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ops-service]
priority=75
command=/usr/local/bin/with-dify-env /usr/local/bin/python3 /usr/local/bin/dify-ops-service
directory=/home/user/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:admin-service]
priority=76
command=/usr/local/bin/with-dify-env /usr/local/bin/python3 /usr/local/bin/dify-admin-service
directory=/home/user/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=80
command=/usr/sbin/nginx -g 'daemon off;'
directory=/home/user/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/data/logs/nginx.log
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
