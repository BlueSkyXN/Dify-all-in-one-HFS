worker_processes auto;
pid /data/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format dify_aio_json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host"}';

    access_log /dev/stdout dify_aio_json;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /data/run/nginx/client_body;
    proxy_temp_path /data/run/nginx/proxy;
    fastcgi_temp_path /data/run/nginx/fastcgi;
    uwsgi_temp_path /data/run/nginx/uwsgi;
    scgi_temp_path /data/run/nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 7860;
        server_name _;

        client_max_body_size 100M;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        location = /nginx-health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8081/healthz;
        }

        location = /_ops {
            return 308 /_ops/$is_args$args;
        }

        location /_ops/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header X-Forwarded-Uri $uri;
            proxy_set_header X-Forwarded-Method $request_method;
        }

        location /console/api {
            proxy_pass http://127.0.0.1:5001;
        }

        location /api {
            proxy_pass http://127.0.0.1:5001;
        }

        location /v1 {
            proxy_pass http://127.0.0.1:5001;
        }

        location /files {
            proxy_pass http://127.0.0.1:5001;
        }

        location /mcp {
            proxy_pass http://127.0.0.1:5001;
        }

        location /triggers {
            proxy_pass http://127.0.0.1:5001;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }

        location /e/ {
            proxy_pass http://127.0.0.1:5002;
            proxy_set_header Dify-Hook-Url $proxy_x_forwarded_proto://$http_host$request_uri;
        }

        location /explore {
            proxy_pass http://127.0.0.1:3000;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
