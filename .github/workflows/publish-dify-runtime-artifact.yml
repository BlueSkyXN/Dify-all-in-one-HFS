name: Publish Dify runtime artifact

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Target mutable slot"
        required: true
        type: choice
        options: [edge, release]
      source_kind:
        description: "Immutable source identity type"
        required: true
        type: choice
        options: [commit, tag]
      source_ref:
        description: "Commit SHA for edge, immutable tag for release"
        required: true
        type: string
      artifact_ref:
        description: "Full immutable Dify fork commit represented by the artifact"
        required: true
        type: string
      runtime_release_tag:
        description: "GitHub Release tag in BlueSkyXN/dify that holds the runtime archive"
        required: true
        type: string
      confirm_publish:
        description: "Type PUBLISH after owner approval"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dify-runtime-artifact-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_publish == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment: dify-runtime-artifact-publish
    timeout-minutes: 30
    env:
      HF_ARTIFACT_BUCKET_URI: ${{ vars.HF_ARTIFACT_BUCKET_URI }}
      HF_TOKEN: ${{ secrets.HF_ARTIFACT_BUCKET_TOKEN }}
      SOURCE_KIND: ${{ inputs.source_kind }}
      SOURCE_REF: ${{ inputs.source_ref }}
      ARTIFACT_REF: ${{ inputs.artifact_ref }}
      RUNTIME_RELEASE_TAG: ${{ inputs.runtime_release_tag }}
      SLOT: ${{ inputs.slot }}
      DIFY_RUNTIME_PRODUCER_REPOSITORY: BlueSkyXN/dify

    steps:
      - name: Checkout wrapper revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install pinned HFS bucket client
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --disable-pip-version-check \
            "huggingface_hub==1.25.1" \
            "click==8.4.2"
          python -m huggingface_hub.cli.hf version
          python -m huggingface_hub.cli.hf --help >/dev/null
          python -m huggingface_hub.cli.hf buckets --help >/dev/null
          python -m huggingface_hub.cli.hf repos settings --help | grep -- --protected

      - name: Validate approved manual inputs
        run: |
          set -euo pipefail
          [[ "${HF_ARTIFACT_BUCKET_URI}" =~ ^hf://buckets/[A-Za-z0-9._-]+/hfs-dist$ ]] || {
            echo "HF_ARTIFACT_BUCKET_URI must name exactly one hfs-dist bucket" >&2
            exit 2
          }
          [[ "${ARTIFACT_REF}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "artifact_ref must be a full lowercase Git SHA" >&2
            exit 2
          }
          if [[ "${SLOT}" == edge && "${SOURCE_KIND}" != commit ]]; then
            echo "edge slot requires a commit source" >&2
            exit 2
          fi
          if [[ "${SLOT}" == release && "${SOURCE_KIND}" != tag ]]; then
            echo "release slot requires an immutable tag source" >&2
            exit 2
          fi
          if [[ "${SOURCE_KIND}" == commit ]]; then
            [[ "${SOURCE_REF}" == "${ARTIFACT_REF}" ]] || {
              echo "edge commit source_ref must equal artifact_ref" >&2
              exit 2
            }
          else
            [[ "${SOURCE_REF}" != latest && "${SOURCE_REF}" != main && "${SOURCE_REF}" != edge && "${SOURCE_REF}" != release \
              && "${SOURCE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ && "${SOURCE_REF}" != *..* ]] || {
              echo "release source_ref must be an immutable, safe tag" >&2
              exit 2
            }
          fi
          [[ "${RUNTIME_RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ && "${RUNTIME_RELEASE_TAG}" != *..* ]] || {
            echo "runtime_release_tag must be a safe immutable release tag" >&2
            exit 2
          }
          [[ -n "${HF_TOKEN}" ]] || { echo "HF_ARTIFACT_BUCKET_TOKEN is required" >&2; exit 2; }
          python scripts/check_hfs_visibility.py \
            --manifest hfs-dev.toml \
            --bucket-uri "$HF_ARTIFACT_BUCKET_URI" \
            --buckets-only

      - name: Download exact producer release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="dify-runtime-${ARTIFACT_REF}.tar.gz"
          gh release download "${RUNTIME_RELEASE_TAG}" \
            --repo "${DIFY_RUNTIME_PRODUCER_REPOSITORY}" \
            --pattern "${artifact}" \
            --dir dist/input
          test -s "dist/input/${artifact}"

      - name: Generate and validate manifest-last handoff
        run: |
          set -euo pipefail
          artifact="dify-runtime-${ARTIFACT_REF}.tar.gz"
          python3 scripts/prepare-dify-artifact-manifest.py \
            --artifact "dist/input/${artifact}" \
            --slot "${SLOT}" \
            --source-kind "${SOURCE_KIND}" \
            --source-ref "${SOURCE_REF}" \
            --artifact-ref "${ARTIFACT_REF}" \
            --output dist/input/manifest.json
          printf '%s  %s\n' "$(sha256sum "dist/input/${artifact}" | cut -d' ' -f1)" "${artifact}" > dist/input/SHA256SUMS.txt
          python3 docker/dify_artifact_contract.py --self-test
          validation_root=$(mktemp -d)
          python3 docker/dify_artifact_contract.py \
            --manifest dist/input/manifest.json \
            --manifest-uri "${HF_ARTIFACT_BUCKET_URI}/dify-all-in-one/${SLOT}/manifest.json" \
            --artifact "dist/input/${artifact}" \
            --install-root "${validation_root}/runtime" \
            --expected-source-ref "${ARTIFACT_REF}"

      - name: Publish archive and read it back before manifest
        run: |
          set -euo pipefail
          artifact="dify-runtime-${ARTIFACT_REF}.tar.gz"
          slot_prefix="${HF_ARTIFACT_BUCKET_URI}/dify-all-in-one/${SLOT}"
          python -m huggingface_hub.cli.hf buckets cp "dist/input/${artifact}" "${slot_prefix}/${artifact}"
          python -m huggingface_hub.cli.hf buckets cp dist/input/SHA256SUMS.txt "${slot_prefix}/SHA256SUMS.txt"
          mkdir -p dist/readback
          python -m huggingface_hub.cli.hf buckets cp "${slot_prefix}/${artifact}" "dist/readback/${artifact}"
          python -m huggingface_hub.cli.hf buckets cp "${slot_prefix}/SHA256SUMS.txt" dist/readback/SHA256SUMS.txt
          cmp "dist/input/${artifact}" "dist/readback/${artifact}"
          cmp dist/input/SHA256SUMS.txt dist/readback/SHA256SUMS.txt

      - name: Publish manifest last and read it back
        run: |
          set -euo pipefail
          slot_prefix="${HF_ARTIFACT_BUCKET_URI}/dify-all-in-one/${SLOT}"
          python -m huggingface_hub.cli.hf buckets cp dist/input/manifest.json "${slot_prefix}/manifest.json"
          mkdir -p dist/readback
          python -m huggingface_hub.cli.hf buckets cp "${slot_prefix}/manifest.json" dist/readback/manifest.json
          cmp dist/input/manifest.json dist/readback/manifest.json
          python scripts/check_hfs_visibility.py \
            --manifest hfs-dev.toml \
            --bucket-uri "$HF_ARTIFACT_BUCKET_URI" \
            --buckets-only
          {
            echo "### Dify runtime artifact published"
            echo "- slot: ${SLOT}"
            echo "- source kind/ref: ${SOURCE_KIND}/${SOURCE_REF}"
            echo "- artifact commit: ${ARTIFACT_REF}"
            echo "- archive/checksum readback: passed before manifest"
            echo "- manifest readback: passed"
            echo "- rollback source: exact GitHub Release asset ${RUNTIME_RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
