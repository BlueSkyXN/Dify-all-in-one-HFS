name: Deploy canonical HFS wrapper

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character GitHub main commit to deploy
        required: true
        type: string
      confirm_upload:
        description: Type PUBLISH_FORMAL to authorize the canonical Space write
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dify-canonical-hfs-wrapper
  cancel-in-progress: false

env:
  FORMAL_SPACE: BlueSkyXN/dify-all-in-one
  HF_CLI_VERSION: "1.5.0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: hfs-production
    steps:
      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Authorize exact main
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_UPLOAD" == PUBLISH_FORMAL ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" == "$SOURCE_REF" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          [[ "$(git rev-parse origin/main)" == "$SOURCE_REF" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Run repository gate
        run: scripts/static-check.sh

      - name: Export and verify formal wrapper
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 scripts/export_hfs_space_bundle.py export \
            --source-commit "$SOURCE_REF" \
            --profile formal \
            --output "$RUNNER_TEMP/hfs-formal-bundle"
          python3 scripts/export_hfs_space_bundle.py verify \
            --profile formal \
            --bundle "$RUNNER_TEMP/hfs-formal-bundle"

      - name: Install pinned Hugging Face client
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: |
          python3 -m pip install --disable-pip-version-check "huggingface_hub==${HF_CLI_VERSION}"
          python3 -m huggingface_hub.cli.hf version

      - name: Require existing private canonical Space and a thin path set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN environment Secret is required" >&2; exit 2; }
          python3 scripts/export_hfs_space_bundle.py paths --profile formal > "$RUNNER_TEMP/hfs-formal-paths"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          expected = set(Path(os.environ["RUNNER_TEMP"], "hfs-formal-paths").read_text().splitlines())
          info = api.space_info(os.environ["FORMAL_SPACE"], token=os.environ["HF_TOKEN"])
          actual = set(api.list_repo_files(os.environ["FORMAL_SPACE"], repo_type="space", token=os.environ["HF_TOKEN"]))
          if info.private is not True:
              raise SystemExit("canonical Space must already exist and be private")
          if actual - expected:
              raise SystemExit("canonical Space contains a path outside the formal bundle allowlist")
          PY

      - name: Upload only the verified wrapper
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 -m huggingface_hub.cli.hf upload \
            "$FORMAL_SPACE" "$RUNNER_TEMP/hfs-formal-bundle" . \
            --repo-type space --revision main \
            --commit-message "Deploy verified formal wrapper ${SOURCE_REF}"

      - name: Complete readback and factory restart
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m huggingface_hub.cli.hf download \
            "$FORMAL_SPACE" --repo-type space --revision main \
            --local-dir "$RUNNER_TEMP/hfs-formal-readback" >/dev/null
          rm -rf "$RUNNER_TEMP/hfs-formal-readback/.cache"
          python3 scripts/export_hfs_space_bundle.py verify \
            --profile formal \
            --bundle "$RUNNER_TEMP/hfs-formal-readback"
          cmp "$RUNNER_TEMP/hfs-formal-bundle/BUILD_SOURCE.json" "$RUNNER_TEMP/hfs-formal-readback/BUILD_SOURCE.json"
          cmp "$RUNNER_TEMP/hfs-formal-bundle/SHA256SUMS" "$RUNNER_TEMP/hfs-formal-readback/SHA256SUMS"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          expected = set(Path(os.environ["RUNNER_TEMP"], "hfs-formal-paths").read_text().splitlines())
          actual = set(api.list_repo_files(os.environ["FORMAL_SPACE"], repo_type="space", token=os.environ["HF_TOKEN"]))
          if actual != expected:
              raise SystemExit("canonical repository path readback does not match the formal allowlist")
          api.restart_space(os.environ["FORMAL_SPACE"], factory_reboot=True)
          PY
