name: Deploy canonical HFS wrapper

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character GitHub main commit to deploy
        required: true
        type: string
      artifact_ref:
        description: Exact 40-character Dify fork commit selected by the release manifest
        required: true
        type: string
      confirm_upload:
        description: Type PUBLISH_FORMAL to authorize the canonical Space repository write
        required: true
        type: string
      confirm_factory_reboot:
        description: Type FACTORY_REBOOT to separately authorize the canonical Space factory reboot
        required: true
        type: string
      confirm_artifact_binding:
        description: Type BIND_ARTIFACT to authorize the exact Space Variable update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dify-canonical-hfs-wrapper
  cancel-in-progress: false

env:
  FORMAL_SPACE: BlueSkyXN/dify-all-in-one
  HF_CLI_VERSION: "1.25.1"
  HF_CLI_CLICK_VERSION: "8.4.2"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: hfs-production
    steps:
      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact main
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          CONFIRM_ARTIFACT_BINDING: ${{ inputs.confirm_artifact_binding }}
          CONFIRM_FACTORY_REBOOT: ${{ inputs.confirm_factory_reboot }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_UPLOAD" == PUBLISH_FORMAL ]]
          [[ "$CONFIRM_ARTIFACT_BINDING" == BIND_ARTIFACT ]]
          [[ "$CONFIRM_FACTORY_REBOOT" == FACTORY_REBOOT ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" == "$SOURCE_REF" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          [[ "$(git rev-parse origin/main)" == "$SOURCE_REF" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Run repository gate
        run: scripts/static-check.sh

      - name: Export and verify formal wrapper
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 scripts/export_hfs_space_bundle.py export \
            --source-commit "$SOURCE_REF" \
            --profile formal \
            --output "$RUNNER_TEMP/hfs-formal-bundle"
          python3 scripts/export_hfs_space_bundle.py verify \
            --source-commit "$SOURCE_REF" \
            --profile formal \
            --bundle "$RUNNER_TEMP/hfs-formal-bundle"

      - name: Install pinned Hugging Face client
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: |
          python3 -m pip install --disable-pip-version-check \
            "huggingface_hub==${HF_CLI_VERSION}" \
            "click==${HF_CLI_CLICK_VERSION}"
          python3 -m huggingface_hub.cli.hf version
          python3 -m huggingface_hub.cli.hf --help >/dev/null
          python3 -m huggingface_hub.cli.hf repos settings --help | grep -- --protected

      - name: Require existing Protected Space, Private Buckets, and a thin path set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN environment Secret is required" >&2; exit 2; }
          python3 scripts/check_hfs_visibility.py \
            --manifest hfs-dev.toml \
            --space "$FORMAL_SPACE" \
            --space-variable-uri DIFY_ARTIFACT_MANIFEST_HF_URI
          python3 scripts/export_hfs_space_bundle.py paths --profile formal > "$RUNNER_TEMP/hfs-formal-paths"

      - name: CAS-upload only the verified wrapper
        id: upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 scripts/export_hfs_space_bundle.py verify \
            --source-commit "$SOURCE_REF" \
            --profile formal \
            --bundle "$RUNNER_TEMP/hfs-formal-bundle"
          python3 scripts/deploy_hfs_formal.py upload \
            --space "$FORMAL_SPACE" \
            --bundle "$RUNNER_TEMP/hfs-formal-bundle" \
            --paths-file "$RUNNER_TEMP/hfs-formal-paths" \
            --source-ref "$SOURCE_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Read back Protected Space and Private Buckets after upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/check_hfs_visibility.py \
            --manifest hfs-dev.toml \
            --space "$FORMAL_SPACE" \
            --space-variable-uri DIFY_ARTIFACT_MANIFEST_HF_URI

      - name: Bind the exact verified release artifact before reboot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEPLOYED_REVISION: ${{ steps.upload.outputs.deployed_revision }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
          CONFIRM_ARTIFACT_BINDING: ${{ inputs.confirm_artifact_binding }}
        run: |
          python3 scripts/deploy_hfs_formal.py bind-artifact \
            --space "$FORMAL_SPACE" \
            --deployed-revision "$DEPLOYED_REVISION" \
            --artifact-ref "$ARTIFACT_REF" \
            --confirm-artifact-binding "$CONFIRM_ARTIFACT_BINDING"

      - name: Factory-reboot the unchanged verified revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEPLOYED_REVISION: ${{ steps.upload.outputs.deployed_revision }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
          CONFIRM_FACTORY_REBOOT: ${{ inputs.confirm_factory_reboot }}
        run: |
          python3 scripts/deploy_hfs_formal.py reboot \
            --space "$FORMAL_SPACE" \
            --deployed-revision "$DEPLOYED_REVISION" \
            --artifact-ref "$ARTIFACT_REF" \
            --confirm-factory-reboot "$CONFIRM_FACTORY_REBOOT"
