standard = "2.1"
project = "dify-all-in-one"
space = "BlueSkyXN/dify-all-in-one"
space_visibility = "protected"
bucket_visibility = "private"
project_class = "preview"
target_role = "primary"
sovereignty = "fork"
lane = "artifact"
version_source = "commit"
env_file = ".env"
secret_files = []

# Values remain in the ignored local ledger. This registry records names and
# deployment relationships only; Docker/bootstrap scripts own pin validation.
local_only = ["HF_TOKEN", "GH_TOKEN"]
secrets = [
  "DIFY_ARTIFACT_BEARER_TOKEN",
  "OPS_TOKEN",
  "DB_PASSWORD",
  "REDIS_PASSWORD",
  "SECRET_KEY",
  "PLUGIN_DAEMON_KEY",
  "PLUGIN_DIFY_INNER_API_KEY",
  "CODE_EXECUTION_API_KEY",
  "SANDBOX_API_KEY",
  "DIFY_AGENT_SERVER_SECRET_KEY",
  "DIFY_AGENT_SHELLCTL_AUTH_TOKEN",
]
optional_secrets = [
  "ADMIN_TOKEN",
]
variables = [
  "DIFY_ARTIFACT_MANIFEST_HF_URI",
  "DIFY_ARTIFACT_EXPECTED_SOURCE_REF",
  "DIFY_ARTIFACT_MAX_BYTES",
  "PERSIST_MODE",
  "POSTGRES_BUCKET_FAILURE_MODE",
  "ADMIN_ENABLED",
  "ADMIN_FILES_DESTRUCTIVE_ENABLED",
  "ADMIN_FILES_ENABLED",
  "ADMIN_FILES_ROOT",
  "ADMIN_FILES_WRITE_ENABLED",
  "AGENT_DRIVE_MANIFEST_ENABLED",
  "DEVICE_FLOW_APPROVE_RATE_LIMIT_PER_HOUR",
  "DIFY_AGENT_ENABLED",
  "ENABLE_AGENT_V2",
  "ENABLE_COLLABORATION_MODE",
  "ENABLE_OAUTH_BEARER",
  "ENABLE_WORKFLOW_RUN_CLEANUP_TASK",
  "NEXT_PUBLIC_ENABLE_AGENT_V2",
  "NEXT_PUBLIC_ENABLE_COLLABORATION_MODE",
  "NEXT_PUBLIC_SOCKET_URL",
  "OPENAPI_ENABLED",
  "OPENAPI_KNOWN_CLIENT_IDS",
  "OPENAPI_RATE_LIMIT_PER_TOKEN",
  "PLUGIN_CWD_PERSISTENCE",
  "PLUGIN_PYTHON_ENV_INIT_TIMEOUT",
  "PLUGIN_SSL_EOF_MAX_RETRIES",
  "PLUGIN_UV_CACHE_DIR",
  "SANDBOX_ENABLE_NETWORK",
  "SANDBOX_SELFCHECK_STRICT",
  "WORKFLOW_LOG_CLEANUP_ENABLED",
]

dist_bucket = "hfs-dist"
# No configuration seed is distributed: entrypoint-generated state stays on
# /data (or its existing /persist mapping) and is never overwritten by deploy.
seed_file = ""
other_objects = []

deviations = [
  "base-image-version = The existing Python base tag remains a reviewed build input; release evidence records its resolved digest.",
  "sandbox-privilege-launcher = A tiny root-owned image-built launcher preserves the upstream Sandbox setuid boundary while the server binary itself is artifact-delivered.",
]
